{# form_prefix: "add" or "edit" — used for unique element ids #}
{# court: dict with field values #}
<div>
  <label for="{{ form_prefix }}-court-name">Name</label>
  <input type="text" id="{{ form_prefix }}-court-name" name="name" value="{{ court.get('name', '')|e }}" placeholder="e.g. YMCA Green Lake" required maxlength="80">
</div>
<div>
  <label for="{{ form_prefix }}-court-nickname">Court nickname <span class="cb-optional">(optional)</span></label>
  <input type="text" id="{{ form_prefix }}-court-nickname" name="nickname" value="{{ court.get('nickname', '')|e }}" placeholder="e.g. The Y" maxlength="80">
</div>
<div>
  <label for="{{ form_prefix }}-court-city">City</label>
  <input type="text" id="{{ form_prefix }}-court-city" name="city" value="{{ court.get('city', '')|e }}" placeholder="e.g. Seattle" required maxlength="80">
</div>
<div>
  <label for="{{ form_prefix }}-court-address">Address <span class="cb-optional">(optional)</span></label>
  <input type="text" id="{{ form_prefix }}-court-address" name="address" value="{{ court.get('address', '')|e }}" placeholder="e.g. 123 Main St" maxlength="120">
</div>
<div>
  <label for="{{ form_prefix }}-court-count">Number of courts <span class="cb-optional">(optional)</span></label>
  <input type="number" id="{{ form_prefix }}-court-count" name="num_courts" min="1" max="99"
         value="{{ court.get('num_courts') if court.get('num_courts') is not none else '' }}"
         placeholder="e.g. 4" style="max-width: 8rem;">
</div>
<div>
  <label for="{{ form_prefix }}-court-io">Indoor or outdoor</label>
  <select id="{{ form_prefix }}-court-io" name="indoor_outdoor" required style="max-width: 14rem;">
    <option value="">Select…</option>
    {% for key, label in indoor_outdoor_options.items() %}
      <option value="{{ key }}" {% if court.get('indoor_outdoor') == key %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div>
  <label for="{{ form_prefix }}-court-net">Net style <span class="cb-optional">(optional)</span></label>
  <select id="{{ form_prefix }}-court-net" name="net_style" style="max-width: 16rem;">
    <option value="">Select…</option>
    {% for key, label in net_style_options.items() %}
      <option value="{{ key }}" {% if court.get('net_style') == key %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div>
  <label for="{{ form_prefix }}-court-cost">Cost to book <span class="cb-optional">(optional)</span></label>
  <select id="{{ form_prefix }}-court-cost" name="booking_cost" style="max-width: 14rem;">
    <option value="">Select…</option>
    {% for key, label in cost_options.items() %}
      <option value="{{ key }}" {% if court.get('booking_cost') == key %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div class="cb-bookable-block">
  <span class="cb-field-label">Bookable online?</span>
  <label class="cb-radio">
    <input type="radio" name="bookable" value="yes" class="cb-bookable-radio" data-form="{{ form_prefix }}"
           {% if court.get('bookable') %}checked{% endif %}>
    Yes
  </label>
  <label class="cb-radio">
    <input type="radio" name="bookable" value="no" class="cb-bookable-radio" data-form="{{ form_prefix }}"
           {% if not court.get('bookable', False) %}checked{% endif %}>
    No
  </label>
</div>
<div id="{{ form_prefix }}-booking-url-wrap" class="cb-url-wrap" {% if not court.get('bookable') %}hidden{% endif %}>
  <label for="{{ form_prefix }}-court-url">Booking link</label>
  <input type="url" id="{{ form_prefix }}-court-url" name="booking_url" value="{{ court.get('booking_url', '')|e }}" placeholder="https://…" maxlength="500">
</div>
<div class="cb-image-block">
  <label for="{{ form_prefix }}-court-image">Image <span class="cb-optional">(optional)</span></label>
  <input type="file" id="{{ form_prefix }}-court-image" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
  <p class="cb-hint">Shown on the court card instead of the letter icon. JPG, PNG, GIF, or WebP — max 5 MB.</p>
  {% if court.get('image_url') %}
    <p class="cb-hint" style="margin-top: 0.5rem;">Current image:</p>
    <img src="{{ court.image_url }}" alt="" class="cb-form-preview">
  {% endif %}
</div>
